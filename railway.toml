# Railway deploy config for nashik-flow-backend (Django + PostGIS)
# Docs: https://docs.railway.com/guides/django

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
